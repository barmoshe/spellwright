<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <!-- mobile-touch-spec §2: home-screen app shell. Landscape only: the manifest locks Add-to-Home-Screen launches to
       landscape + fullscreen (icons = assets/src/art/appicon nearest-upscaled ×3 / ×8 into icons/). -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spellwright" />
  <meta name="theme-color" content="#2a2a3a" />
  <title>Spellwright</title>
  <link rel="icon" href="data:," />
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0b0a10; overflow: hidden;
      -webkit-user-select: none; user-select: none; overscroll-behavior: none;
      touch-action: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    /* Integer-zoomed canvas is centred here; the page background is the letterbox. */
    #game-root { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; touch-action: none; }
    /* Safe-area probe (mobile-touch-spec §1): display.js reads its computed padding = env(safe-area-inset-*). */
    #safe-probe {
      position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }
    /* Rotate overlay (mobile-touch-spec §7.1): DOM so it is crisp at any scale; display.js toggles it. */
    #rotate {
      position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #0b0a10; color: #fdf7ed; font: 20px/1.3 -apple-system, system-ui, sans-serif; text-align: center; padding: 24px;
      touch-action: none;
    }
    #rotate.on { display: flex; }
    #rotate svg { width: 64px; height: 64px; animation: sw-rot 2s steps(1, end) infinite; }
    @keyframes sw-rot { 0% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
    @media (prefers-reduced-motion: reduce) { #rotate svg { animation: none; } }
    #rotate.static svg { animation: none; }
    #game-root canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    /* Perf overlay (F3). DOM, not canvas: costs zero draw calls and ignores scene order. */
    #perf {
      position: fixed; left: 6px; top: 6px; z-index: 10; display: none;
      font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; color: #cfe;
      background: rgba(0,0,0,.6); padding: 4px 6px; border-radius: 3px; white-space: pre; pointer-events: none;
    }
    #dev-banner {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; display: none;
      font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #fff; background: #7a1030;
      padding: 4px 8px; white-space: pre-wrap; max-height: 30vh; overflow: auto;
    }
  </style>
</head>
<body>
  <div id="game-root"></div>
  <div id="perf"></div>
  <div id="dev-banner"></div>
  <div id="safe-probe"></div>
  <div id="rotate" role="alert" aria-live="assertive">
    <svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="#fdf7ed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <rect x="20" y="8" width="24" height="44" rx="4" />
      <line x1="29" y1="46" x2="35" y2="46" />
      <path d="M50 30 a18 18 0 0 1 -8 20" /><path d="M40 47 l2 3 l3 -2" />
    </svg>
    <div id="rotate-text">Turn your phone sideways to play</div>
  </div>
  <!-- Runtime origin: HTTP (python3 -m http.server 8741). ES modules + Phaser 4.1.0 (lib/).
       Do NOT open via file:// — module scripts and loader JSON/text fetches require http. -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
